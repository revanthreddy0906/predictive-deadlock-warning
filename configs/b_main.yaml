# Option B (AWS EC2): test split, seeds 100,000-109,999. All reported numbers come from here.
run_name: b_main
split: test
seeds: {start: 100000, count: 10000}
scenarios: [normal, spike, deadlock_prone]
sizes:
  - {processes: 10, resources: 5}
  - {processes: 25, resources: 8}
  - {processes: 50, resources: 10}
  - {processes: 100, resources: 20}
  - {processes: 200, resources: 20}
steps: 15000
indicator_window: 10
min_safe_gap: 5
lookahead: {max_n_all_seeds: 25, subsample_seeds: 200, subsample_by_n: {200: 50}}
store_full_trace_seeds: 5
chunk_size: 25
workers: auto
