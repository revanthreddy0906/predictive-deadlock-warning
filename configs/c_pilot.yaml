# Full paper (Option C) pilot on EC2: measures per-sequence cost with and without lookahead at every
# size (seeds 0-14 get lookahead, 15-29 do not) to project the full run before launching it.
run_name: c_pilot
split: tuning
seeds: {start: 0, count: 30}
scenarios: [normal, spike, deadlock_prone]
sizes:
  - {processes: 10, resources: 5}
  - {processes: 25, resources: 8}
  - {processes: 50, resources: 10}
  - {processes: 100, resources: 20}
  - {processes: 200, resources: 20}
steps: 15000
indicator_window: 10
min_safe_gap: 5
lookahead: {max_n_all_seeds: 25, subsample_seeds: 15, subsample_by_n: {200: 15}}
store_full_trace_seeds: 0
chunk_size: 5
workers: auto
extras: true
