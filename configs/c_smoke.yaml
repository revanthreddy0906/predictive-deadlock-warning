# End-to-end check of the full-paper pipeline (extras + learned baselines), small.
run_name: c_smoke
split: tuning
seeds: {start: 0, count: 40}
scenarios: [normal, spike, deadlock_prone]
sizes:
  - {processes: 10, resources: 5}
  - {processes: 25, resources: 8}
steps: 15000
indicator_window: 10
min_safe_gap: 5
lookahead: {max_n_all_seeds: 25, subsample_seeds: 0}
store_full_trace_seeds: 2
chunk_size: 10
workers: auto
extras: true
